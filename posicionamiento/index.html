<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento - Juan Manuel Correa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Posicionamiento CSS - Juan Manuel Correa</h1>
        <p>3128643741</p>
    </header>

    <div class="container">
        <section>
            <h2>Posicionamiento Static</h2>
            <div class="box static">Static</div>
        </section>

        <section>
            <h2>Posicionamiento Relative</h2>
            <div class="box relative">Relative</div>
        </section>

        <section>
            <h2>Posicionamiento Absolute</h2>
            <div class="box-container">
                <div class="box absolute">Absolute</div>
            </div>
        </section>

        <section>
            <h2>Posicionamiento Fixed</h2>
            <div class="box fixed">Fixed</div>
        </section>

        <section>
            <h2>Posicionamiento Sticky</h2>
            <div class="box sticky">Sticky</div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Juan Manuel Correa</p>
    </footer>
</body>
</html>
